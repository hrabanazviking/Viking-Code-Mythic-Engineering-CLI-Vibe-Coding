name: Release Android

# Phase 22.2 — native Android wrapper app. Triggered by pushing a
# v*.*.* tag (mirrors the rest of the v1.x release pipeline) plus
# workflow_dispatch for build-only rehearsal.
#
# Foundation-level: builds the unsigned release APK + uploads as
# a workflow artifact. Future session adds:
#   - APK signing config (keystore + alias secrets).
#   - F-Droid metadata + automated submission.
#   - Play Store automated submission via fastlane / triple-T plugin.
#   - Sigstore APK signing via apksigv4 + cosign-installer once
#     cosign supports APK signing natively.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Gradle assembleRelease
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib, pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Phase 23.5 — decode the keystore secret to a temp file and
      # set the env vars app/build.gradle.kts reads. The four
      # secrets are optional: when any is missing we skip the
      # decode and the build produces an unsigned release APK
      # (matches PH-22.2 foundation behavior). When ALL four are
      # present, the build produces a signed release APK that
      # installs on Android devices without "unknown developer"
      # warnings.
      - name: Decode signing keystore (when secrets configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] \
              || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::ANDROID_KEYSTORE_* secrets incomplete — release APK will be unsigned"
            echo "signing_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/mythic-release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "signing_available=true" >> "$GITHUB_OUTPUT"
          echo "Keystore decoded — release APK will be signed"

      - name: Build Android release APK
        working-directory: packaging/android
        run: |
          # When the Decode keystore step set the env vars above,
          # app/build.gradle.kts wires the signingConfig into the
          # release buildType. When secrets are absent, the env
          # vars are unset and the build produces an unsigned APK
          # (foundation fallback).
          chmod +x ./gradlew || true
          # The android Gradle wrapper isn't checked in at the
          # foundation level — a future session generates it via
          # `gradle wrapper` on a workstation and commits the
          # resulting `gradle/wrapper/` files. For now, rely on
          # the system-installed Gradle (provisioned via SDKMAN!
          # during the Android build pre-prep).
          gradle wrapper --gradle-version 8.10
          ./gradlew assembleRelease --no-configuration-cache

      - name: Locate built APK
        id: apk
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK_PATH=$(find packaging/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::no APK produced under packaging/android/app/build/outputs/apk/release/"
            exit 1
          fi
          mkdir -p dist-android
          ASSET_NAME="mythic-vibe-${VERSION}-android.apk"
          cp "$APK_PATH" "dist-android/${ASSET_NAME}"
          cd dist-android
          sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          ls -la
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      # Phase 21.5 — Sigstore signing applied to the APK. Note
      # that this is a separate signature from Android's APK
      # signing scheme v2/v3 — Sigstore signs the file bytes for
      # supply-chain provenance; APK signing covers Android's
      # install-time verification. Future session: APK signing
      # config so the release APK installs without "unknown source".
      - name: Sign APK with Sigstore (keyless)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: dist-android/mythic-vibe-*.apk

      # Phase 21.6 — SLSA Level 3 build provenance.
      - name: Attest APK build provenance
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-android/mythic-vibe-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/*
          if-no-files-found: error

  github-release:
    name: Attach APK to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist-android
      - name: Upload to existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-android/*
