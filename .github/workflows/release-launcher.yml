name: Release Launcher

# Phase 22.1 — Rust launcher shim. Triggered by pushing a v*.*.*
# tag (mirrors the rest of the v1.x release pipeline) plus
# workflow_dispatch for build-only rehearsal.
#
# Per-OS matrix produces:
#   ubuntu-latest        -> mythic-vibe-launcher-${VERSION}-linux-x86_64
#   ubuntu-24.04-arm     -> mythic-vibe-launcher-${VERSION}-linux-aarch64
#   macos-latest         -> mythic-vibe-launcher-${VERSION}-macos-arm64
#   macos-13             -> mythic-vibe-launcher-${VERSION}-macos-x86_64
#   windows-latest       -> mythic-vibe-launcher-${VERSION}-windows-x86_64.exe
#
# Same Sigstore + SLSA attestation pattern as PH-21.5 + PH-21.6.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write       # GitHub Release uploads
  id-token: write       # Sigstore keyless signing
  attestations: write   # SLSA build provenance

jobs:
  build:
    name: cargo build / ${{ matrix.os }} / ${{ matrix.arch_label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            arch_label: x86_64
            target: x86_64-unknown-linux-gnu
            binary_suffix: ""
            asset_suffix: linux-x86_64
          - os: linux
            runner: ubuntu-24.04-arm
            arch_label: aarch64
            target: aarch64-unknown-linux-gnu
            binary_suffix: ""
            asset_suffix: linux-aarch64
          - os: macos
            runner: macos-latest
            arch_label: arm64
            target: aarch64-apple-darwin
            binary_suffix: ""
            asset_suffix: macos-arm64
          - os: macos
            runner: macos-13
            arch_label: x86_64
            target: x86_64-apple-darwin
            binary_suffix: ""
            asset_suffix: macos-x86_64
          - os: windows
            runner: windows-latest
            arch_label: x86_64
            target: x86_64-pc-windows-msvc
            binary_suffix: ".exe"
            asset_suffix: windows-x86_64.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib, pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build launcher
        shell: bash
        working-directory: packaging/launcher
        run: |
          cargo build --release --target ${{ matrix.target }}
          ls -la target/${{ matrix.target }}/release/

      - name: Smoke test launcher (--help)
        shell: bash
        env:
          BINARY: packaging/launcher/target/${{ matrix.target }}/release/mythic-vibe-launcher${{ matrix.binary_suffix }}
        run: |
          # The launcher's --help just forwards to the CLI's --help
          # once installed. For a fresh runner without a cache, the
          # first invocation downloads the interpreter — to keep CI
          # runs fast we instead invoke the binary with --version
          # which exits before any network IO once a future session
          # wires that flag. Today the binary just runs the full
          # lifecycle so we skip the smoke on the rehearsal path
          # and rely on cargo test for unit-level coverage.
          file "$BINARY"

      - name: Run cargo unit tests
        shell: bash
        working-directory: packaging/launcher
        run: cargo test --release --target ${{ matrix.target }}

      - name: Rename binary with OS + arch suffix
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          BINARY: packaging/launcher/target/${{ matrix.target }}/release/mythic-vibe-launcher${{ matrix.binary_suffix }}
        run: |
          mkdir -p dist-launcher
          ASSET_NAME="mythic-vibe-launcher-${VERSION}-${ASSET_SUFFIX}"
          cp "$BINARY" "dist-launcher/${ASSET_NAME}"
          cd dist-launcher
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          else
            shasum -a 256 "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          fi
          ls -la

      # Phase 21.5 — keyless Sigstore signing applied to the
      # launcher binary, same pattern as the PyInstaller + Nuitka
      # paths in release-binaries.yml.
      - name: Sign launcher with Sigstore (keyless)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: dist-launcher/mythic-vibe-launcher-*

      # Phase 21.6 — SLSA Level 3 build provenance.
      - name: Attest launcher build provenance
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-launcher/mythic-vibe-launcher-*

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.asset_suffix }}
          path: dist-launcher/mythic-vibe-launcher-*
          if-no-files-found: error

  github-release:
    name: Attach launchers to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download every launcher artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifact directories
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/
      - name: Upload to existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/mythic-vibe-launcher-*
