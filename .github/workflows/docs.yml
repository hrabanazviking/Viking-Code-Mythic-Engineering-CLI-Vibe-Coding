name: Documentation

# Phase 23.1 — mkdocs-material site build + GitHub Pages deploy.
#
# On every PR + push to development: build with --strict to catch
# broken links, missing nav entries, unrecognized warnings.
# On push to main: also deploy to GitHub Pages so docs.<repo>.io
# stays current with the latest stable release.

on:
  push:
    branches:
      - main
      - development
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment so a fast follow-up push
# doesn't deploy stale content over fresh content.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build site (strict mode)
        # --strict turns warnings into errors. Catches:
        #   - broken inter-doc links
        #   - nav entries pointing at missing files
        #   - markdown extensions that the config doesn't enable
        # The `--clean` flag wipes any stale site/ output.
        run: mkdocs build --strict --clean

      - name: Upload built site as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          if-no-files-found: error

      # GitHub Pages deploy only on main pushes. PRs + development
      # branches build but don't deploy.
      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
