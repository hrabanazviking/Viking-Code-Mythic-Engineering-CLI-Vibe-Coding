name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - main

jobs:
  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest -q --cov=mythic_vibe_cli --cov-report=term-missing

  quality:
    name: Lint, Types, Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check mythic_vibe_cli tests scripts

      - name: Mypy type check
        run: mypy mythic_vibe_cli

      - name: Changelog gate
        run: python scripts/check_changelog.py

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: twine check dist/*
