[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mythic-vibe-cli"
version = "0.1.0"
description = "Beginner-friendly CLI that enforces Mythic Engineering vibe-coding workflow"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Mythic Vibe Contributors" }
]
maintainers = [
  { name = "Mythic Vibe Contributors" }
]
keywords = ["cli", "vibe-coding", "mythic-engineering", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Documentation"
]

[project.urls]
Homepage = "https://github.com/hrabanazviking/Mythic-Engineering"
Repository = "https://github.com/hrabanazviking/Viking-Code-Mythic-Engineering-CLI-Vibe-Coding"
Issues = "https://github.com/hrabanazviking/Viking-Code-Mythic-Engineering-CLI-Vibe-Coding/issues"
Changelog = "https://github.com/hrabanazviking/Viking-Code-Mythic-Engineering-CLI-Vibe-Coding/blob/development/CHANGELOG.md"

[project.scripts]
mythic-vibe = "mythic_vibe_cli.cli:main"
mythic = "mythic_vibe_cli.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "tomli>=2.0; python_version < '3.11'",
  # Phase 19.4 (audit remediation 2026-05-02): property-based
  # testing for state migrations. MPL-licensed, pure-Python,
  # mature. Test-time only — never imported in production paths.
  "hypothesis>=6.0"
]
lint = [
  "ruff>=0.8"
]
type = [
  "mypy>=1.10"
]
build = [
  "build>=1.2",
  "twine>=5.0"
]
docs = [
  "mkdocs>=1.6"
]
ux = [
  "rich>=13.0"
]
tui = [
  "textual>=0.80"
]
ai = [
  "anthropic>=0.34",
  "google-genai>=1.0",
  "openai>=1.40"
]
# PH-16 OpenTelemetry exporter — opt-in via MYTHIC_OTEL_ENABLED=1.
otel = [
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
  "opentelemetry-exporter-otlp-proto-http>=1.20"
]
# PH-09 island adapters — each gated behind MYTHIC_ISLAND_<NAME>_ENABLED.
mindspark = [
  "thoughtforge>=0.1"
]
wyrd = [
  "wyrd-protocol>=1.0"
]
yggdrasil = [
  "yggdrasil>=0.1"
]
dev = [
  "anthropic>=0.34",
  "build>=1.2",
  "google-genai>=1.0",
  "hypothesis>=6.0",
  "mkdocs>=1.6",
  "mypy>=1.10",
  "openai>=1.40",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "rich>=13.0",
  "ruff>=0.8",
  "textual>=0.80",
  "tomli>=2.0; python_version < '3.11'",
  "twine>=5.0"
]

[tool.setuptools.packages.find]
include = ["mythic_vibe_cli*"]

[tool.setuptools.package-data]
mythic_vibe_cli = ["resources/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["mythic_vibe_cli"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise SystemExit"
]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mythic_vibe_cli"]

[tool.mypy]
python_version = "3.10"
packages = ["mythic_vibe_cli"]
ignore_missing_imports = true
warn_unused_configs = true
no_strict_optional = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "mythic_vibe_cli.*"
ignore_errors = true
